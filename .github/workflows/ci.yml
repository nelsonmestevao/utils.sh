name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  TERM: xterm

jobs:
  test:
    name: Tests and Coverage
    runs-on: ubuntu-26.04

    steps:
      - name: ☁️ Checkout repository
        uses: actions/checkout@v7

      - name: 🧰 Install the development tools
        run: make setup

      - name: 🧹 Lint the scripts
        run: make lint

      - name: 🔬 Run the tests with coverage
        run: script -qec 'make coverage'

      - name: 📊 Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/bats/coverage.json') != '' }}
        run: |
          jq -r '
            "### 🐚 Coverage: \(.percent_covered)%\n",
            "| File | Covered | Lines |",
            "|---|---:|---:|",
            (.files[] | "| `\(.file | sub(".*/scripts/"; "scripts/"))` | \(.percent_covered)% | \(.covered_lines)/\(.total_lines) |")
          ' coverage/bats/coverage.json >>"$GITHUB_STEP_SUMMARY"
