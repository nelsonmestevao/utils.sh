name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bats and kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y bats kcov

      - name: Run tests with coverage
        run: |
          export TERM=xterm
          script -qec 'make coverage'

      - name: Write coverage summary
        if: always() && hashFiles('coverage/bats/coverage.json') != ''
        run: |
          jq -r '
            "### Coverage: \(.percent_covered)%\n",
            "| File | Covered | Lines |",
            "|---|---:|---:|",
            (.files[] | "| `\(.file | sub(".*/scripts/"; "scripts/"))` | \(.percent_covered)% | \(.covered_lines)/\(.total_lines) |")
          ' coverage/bats/coverage.json >>"$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/bats/coverage.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
