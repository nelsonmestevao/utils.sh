name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-26.04

    steps:
      - name: ☁️ Checkout repository
        uses: actions/checkout@v7

      - name: 🔖 Check the tag matches the scripts version
        run: |
          version=$(sed -n 's/^UTILS_VERSION=//p' scripts/helpers.sh)
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match UTILS_VERSION=${version} in scripts/helpers.sh"
            exit 1
          fi

      - name: 📝 Take the release notes from the changelog
        run: |
          # The lines between "## <version> ..." and the next "## " header
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found
          ' CHANGELOG.md >notes.md

          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"
            exit 1
          fi

      - name: 🚀 Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
